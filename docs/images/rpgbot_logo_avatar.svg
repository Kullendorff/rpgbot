<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="facetTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bakgrund -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- d20: hexagon delad av innre triangel F-B-D i tre facetter -->
  <!-- Hörn: A(100,35) B(161,70) C(161,140) D(100,175) E(39,140) F(39,70) -->
  <polygon points="100,35 161,70 39,70" fill="url(#facetTop)" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="161,70 161,140 100,175" fill="url(#facetRight)" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="39,70 39,140 100,175" fill="url(#facetLeft)" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inre triangelns kanter (tärningens framsida) -->
  <polygon points="39,70 161,70 100,175" fill="none" stroke="#ede9fe" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Tärningens siffriga hjärta: glöd + "20" på framsidan -->
  <circle cx="100" cy="103" r="26" fill="url(#glow)"/>
  <text x="100" y="112" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800"
        fill="#fef3c7">20</text>

  <!-- Sparkar: två små diamantsparkar för rollfantasin -->
  <path d="M170 40 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#fde68a" opacity="0.85"/>
  <path d="M28 148 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#c4b5fd" opacity="0.8"/>
</svg>
